<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f9f4">
  <meta name="description" content="地図を見ながら、47都道府県の場所・県庁所在地・魅力を学ぶ4択クイズ。">
  <title>都道府県クイズ</title>
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <script src="../../shared/return.js"></script>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" data-action="home"><img src="./assets/icon.svg" alt="" width="36" height="36">都道府県クイズ</a>
      <button class="quiet" id="ruby-toggle" type="button" data-action="ruby" aria-pressed="true">ふりがな</button>
    </div>
  </header>
  <main id="app" class="main"><noscript>都道府県クイズを使うには、ブラウザで JavaScript を有効にしてください。</noscript></main>
  <footer class="site-footer">
    <button class="text-button" type="button" data-action="sources">教材の出典</button>
    <button class="text-button" type="button" data-action="settings">記録の設定</button>
  </footer>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-message"></p>
      <div class="actions">
        <button class="button" value="cancel" autofocus>キャンセル</button>
        <button class="button primary" id="confirm-accept" value="confirm">決定</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="./js/app.js"></script>
</body>
</html>

<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#315b47"><title>授業準備チェック｜組込み見本</title><style>
:root{font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#f7f5ed;color:#354c37;line-height:1.8;font-size:17px}*{box-sizing:border-box}body{margin:0}main{max-width:650px;padding:20px;margin:0 auto 60px}header{text-align:center;margin:10px 0 30px}header>p:first-child{font-size:12px;color:#82916d;letter-spacing:.1em}h1{font-size:29px;margin:10px 0}header>p:last-child{font-size:15px;color:#748064}.paper{background:#fffdf8;border:1px solid #dddcca;border-radius:15px;padding:25px;box-shadow:0 9px 35px #4d4d3008}.progress{display:flex;justify-content:space-between;align-items:center;color:#65804f;font-size:14px;border-bottom:1px solid #e3e4d7;padding-bottom:15px;margin-bottom:10px}.progress strong{font-size:21px}label{display:flex;align-items:center;gap:15px;min-height:66px;padding:12px 5px;border-bottom:1px solid #eeeee1;cursor:pointer}input{width:23px;height:23px;accent-color:#527b48;flex-shrink:0}label:has(input:checked) span{color:#88977b;text-decoration:line-through}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #315b47;outline-offset:4px}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:15px}.footer p{font-size:12px;color:#758069}.footer button{font:inherit;min-height:44px;cursor:pointer;border:1px solid #cbd3be;border-radius:7px;background:#fffdf7;padding:8px 14px;color:#647d51;font-size:13px}.note{text-align:center;font-size:12px;color:#7e886e;margin-top:22px}#save-status{color:#9d4b32}@media(max-width:430px){main{padding:15px}.paper{padding:18px}h1{font-size:25px}.footer{align-items:flex-start;flex-direction:column}}
</style></head><body><script src="../../shared/return.js"></script><main><header><p>組込み見本 · 先生の仕事</p><h1>授業準備チェック</h1><p>準備がととのうと、気持ちにも少し余白が生まれます。</p></header><section class="paper" aria-label="授業の準備リスト"><div class="progress"><span>きょうの準備</span><span id="progress" role="status"><strong>0</strong> / 6 完了</span></div><label><input type="checkbox" value="goal"><span>授業のねらいと流れを確かめた</span></label><label><input type="checkbox" value="materials"><span>教材・教具をそろえた</span></label><label><input type="checkbox" value="print"><span>配付するものを準備した</span></label><label><input type="checkbox" value="board"><span>板書の流れを考えた</span></label><label><input type="checkbox" value="device"><span>端末・表示画面を確かめた</span></label><label><input type="checkbox" value="question"><span>考えを深める問いを用意した</span></label><div class="footer"><p>チェックはこの端末内だけに保存します。<br><span id="save-status" role="status"></span></p><button id="reset">チェックを外す</button></div></section><p class="note">この見本では、児童名などの個人情報を入力しません。</p></main><script>
const key='kyozai:tool:lesson-checklist:checked:v1';const boxes=[...document.querySelectorAll('input[type=checkbox]')];
try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))for(const box of boxes)box.checked=saved.includes(box.value);}catch{}
function update(){const checked=boxes.filter(b=>b.checked).map(b=>b.value);document.querySelector('#progress').innerHTML='<strong>'+checked.length+'</strong> / 6 完了';try{localStorage.setItem(key,JSON.stringify(checked));}catch{document.querySelector('#save-status').textContent='この端末では保存できません。画面を閉じるとチェックは消えます。';}}
for(const box of boxes)box.addEventListener('change',update);
document.querySelector('#reset').addEventListener('click',()=>{for(const box of boxes)box.checked=false;update();});update();
</script></body></html>
